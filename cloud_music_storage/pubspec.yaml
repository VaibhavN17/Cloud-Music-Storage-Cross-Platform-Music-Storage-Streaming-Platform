name: cloud_music_storage
description: "Cloud Music Storage — Cross-platform personal music cloud storage & streaming."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Routing ──
  go_router: ^14.8.1

  # ── Networking ──
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.1.4

  # ── Local Storage ──
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5

  # ── Audio ──
  just_audio: ^0.9.43
  audio_service: ^0.18.17
  audio_session: ^0.1.22

  # ── Authentication ──
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4

  # ── UI Components ──
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

  # ── File Handling ──
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # ── Utilities ──
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  intl: ^0.19.0
  uuid: ^4.5.1
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  collection: ^1.19.1

  # ── Icons ──
  iconsax_flutter: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ── Code Generation ──
  build_runner: ^2.4.14
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.4

  # ── Testing ──
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
